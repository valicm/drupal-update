name: Binary release
# Runs for a pushed version tag, or from Tag release with the tag it just created.
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_call:
    inputs:
      version:
        description: Existing release tag, for example v6.0.0
        required: true
        type: string
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build binary archives and checksums
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: python3 scripts/build-release.py --version "$RELEASE_VERSION"
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      # Lets users check an archive came from this workflow: gh attestation verify <archive> --repo valicm/drupal-update
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          args=(--verify-tag --generate-notes)
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_VERSION" dist/* "${args[@]}"
