name: Tests
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Check Bash wrapper syntax
        run: bash -n drupal-update.sh
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./*.go)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Run tests with real Composer and project fixtures
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build and smoke-test CLI
        run: |
          go build -trimpath -o "$RUNNER_TEMP/drupal-update" .
          "$RUNNER_TEMP/drupal-update" --help
      - name: Smoke-test release packaging
        if: matrix.php == '8.4'
        run: |
          python3 scripts/build-release.py --version v6.0.0-ci --target linux/amd64 --output "$RUNNER_TEMP/release-smoke"
          cd "$RUNNER_TEMP/release-smoke"
          sha256sum --check SHA256SUMS
          tar -xzf drupal-update_v6.0.0-ci_linux_amd64.tar.gz
          ./drupal-update --version
          bash ./drupal-update.sh --version
  workflows:
    name: Validate GitHub workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= .github/workflows/*.yml examples/*.yml
  action:
    name: Composite Action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: updater
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Prepare offline Composer project
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          project = {
              "name": "test/action-smoke",
              "require": {"drupal/demo": "1.0.0"},
              "repositories": [
                  {"type": "package", "package": [
                      {"name": "drupal/demo", "version": "1.0.0", "type": "metapackage"},
                      {"name": "drupal/demo", "version": "1.5.0", "type": "metapackage"},
                      {"name": "drupal/demo", "version": "2.0.0", "type": "metapackage"},
                  ]},
                  {"packagist.org": False},
              ],
          }
          Path("composer.json").write_text(json.dumps(project))
          PYCODE
          composer update --no-interaction --no-progress
      - uses: ./updater
        id: updater
        with:
          update_type: minor
          update_scope: contrib
          update_packages: demo
          output_file: report.md
      - name: Verify update, exported summary and outputs
        env:
          CHANGED: ${{ steps.updater.outputs.changed }}
          REPORT: ${{ steps.updater.outputs.report }}
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          lock = json.loads(Path("composer.lock").read_text())
          assert lock["packages"][0]["version"] == "1.5.0"
          assert json.loads(Path("composer.json").read_text())["require"]["drupal/demo"] == "1.5.0"
          assert "1.5.0" in os.environ["DRUPAL_UPDATES_TABLE"]
          assert "drupal/demo" in os.environ["DRUPAL_UPDATES_TABLE"]
          assert os.environ["CHANGED"] == "true"
          assert os.environ["REPORT"].strip() == Path("report.md").read_text().strip()
          PYCODE
