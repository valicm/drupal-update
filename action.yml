name: Drupal Composer updates
description: Update Drupal packages using the Go CLI
author: valicm
inputs:
  update_type:
    description: 'security, minor, major, nuclear, semver-safe-update or all'
    default: semver-safe-update
  update_core:
    description: Include Drupal core updates
    default: 'true'
  update_exclude:
    description: Comma-separated package or module names
    default: ''
  composer_command:
    description: Composer launcher, for example ddev composer
    default: composer
  update_scope:
    description: all, core or contrib
    default: all
  update_packages:
    description: Comma-separated packages or module names to update
    default: ''
  skip_patched:
    description: Skip update targets with configured patches
    default: 'false'
  patch_failure:
    description: fail or skip (skip is supported for minor/major only)
    default: fail
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: '1.25.x'
        cache: false
    - name: Build updater
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "$RUNNER_TEMP/drupal-update" .
    - name: Update Drupal
      shell: bash
      env:
        INPUT_UPDATE_TYPE: ${{ inputs.update_type }}
        INPUT_UPDATE_CORE: ${{ inputs.update_core }}
        INPUT_UPDATE_EXCLUDE: ${{ inputs.update_exclude }}
        INPUT_COMPOSER_COMMAND: ${{ inputs.composer_command }}
        INPUT_UPDATE_SCOPE: ${{ inputs.update_scope }}
        INPUT_UPDATE_PACKAGES: ${{ inputs.update_packages }}
        INPUT_SKIP_PATCHED: ${{ inputs.skip_patched }}
        INPUT_PATCH_FAILURE: ${{ inputs.patch_failure }}
      run: '"$RUNNER_TEMP/drupal-update"'
