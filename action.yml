name: Drupal Composer updates
description: Update Drupal core and contributed modules with Composer
author: valicm
branding:
  icon: check-circle
  color: blue
inputs:
  install_existing_config:
    description: Install locked Drupal from existing config BEFORE upgrading; disposable database only
    default: 'false'
  updatedb:
    description: Run Drush updatedb after a successful Composer upgrade
    default: 'false'
  export_config:
    description: Export configuration after database updates (requires updatedb)
    default: 'false'
  drush_command:
    description: Drush launcher, for example ddev drush
    default: vendor/bin/drush
  update_type:
    description: 'security, minor, major, nuclear, semver-safe-update or all'
    default: semver-safe-update
  update_core:
    description: Include Drupal core updates
    default: 'true'
  update_exclude:
    description: Comma-separated package or module names
    default: ''
  composer_command:
    description: Composer launcher, for example ddev composer
    default: composer
  update_scope:
    description: all, core or contrib
    default: all
  update_packages:
    description: Comma-separated packages or module names to update
    default: ''
  security_update_pinned:
    description: Allow security fixes to advance exact pins within the current minor version
    default: 'false'
  skip_patched:
    description: Skip update targets with configured patches
    default: 'false'
  patch_failure:
    description: fail or skip (skip is supported for minor/major only)
    default: fail
  output_file:
    description: Also write the Markdown report to this .md file
    default: ''
outputs:
  changed:
    description: "'true' when composer.json, composer.lock or patches.lock.json changed"
    value: ${{ steps.update.outputs.changed }}
  report:
    description: The Markdown report, also exported as DRUPAL_UPDATES_TABLE
    value: ${{ steps.update.outputs.report }}
runs:
  using: composite
  steps:
    # A release tag runs that release's checksum-verified binary; any other ref builds its source.
    - name: Choose updater build
      id: select
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
      run: |
        if [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]; then
          echo "release=$ACTION_REF" >> "$GITHUB_OUTPUT"
        fi
    - if: steps.select.outputs.release == ''
      uses: actions/setup-go@v7
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false
    - if: steps.select.outputs.release == ''
      name: Build updater
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "$RUNNER_TEMP/drupal-update" .
    - name: Update Drupal
      id: update
      shell: bash
      env:
        DRUPAL_UPDATE_VERSION: ${{ steps.select.outputs.release }}
        DRUPAL_UPDATE_BINARY: ${{ steps.select.outputs.release == '' && format('{0}/drupal-update', runner.temp) || '' }}
        INPUT_INSTALL_EXISTING_CONFIG: ${{ inputs.install_existing_config }}
        INPUT_UPDATEDB: ${{ inputs.updatedb }}
        INPUT_EXPORT_CONFIG: ${{ inputs.export_config }}
        INPUT_DRUSH_COMMAND: ${{ inputs.drush_command }}
        INPUT_UPDATE_TYPE: ${{ inputs.update_type }}
        INPUT_UPDATE_CORE: ${{ inputs.update_core }}
        INPUT_UPDATE_EXCLUDE: ${{ inputs.update_exclude }}
        INPUT_COMPOSER_COMMAND: ${{ inputs.composer_command }}
        INPUT_UPDATE_SCOPE: ${{ inputs.update_scope }}
        INPUT_UPDATE_PACKAGES: ${{ inputs.update_packages }}
        INPUT_SECURITY_UPDATE_PINNED: ${{ inputs.security_update_pinned }}
        INPUT_SKIP_PATCHED: ${{ inputs.skip_patched }}
        INPUT_PATCH_FAILURE: ${{ inputs.patch_failure }}
        INPUT_OUTPUT_FILE: ${{ inputs.output_file }}
      run: bash "$GITHUB_ACTION_PATH/drupal-update.sh"
