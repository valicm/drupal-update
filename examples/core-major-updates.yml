# Copy into .github/workflows/ in your Drupal project.
# Set DRUPAL_UPDATE_TOKEN to a PAT with Contents and Pull requests write.
# For a GitHub App, generate a token in the job and use that step output instead.
# Match PHP/extensions below to the project and configure its PR validation checks.
name: Drupal core major updates around release windows
on:
  workflow_dispatch:
  schedule:
    - cron: '47 4 * 6,8,12 5' # Fridays in June, August, December; even years only below.
permissions:
  contents: read
concurrency:
  group: drupal-dependency-updates
  cancel-in-progress: false
jobs:
  window:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.window.outputs.run }}
    steps:
      - name: Match core major release years (manual runs always allowed)
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          release_year=$(date -u +%Y)
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]] || (( release_year % 2 == 0 )); then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
  update:
    needs: window
    if: needs.window.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require the automation token
        env:
          UPDATE_TOKEN: ${{ secrets.DRUPAL_UPDATE_TOKEN }}
        run: |
          if [ -z "$UPDATE_TOKEN" ]; then
            echo "Set DRUPAL_UPDATE_TOKEN so update PRs can trigger required checks."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.DRUPAL_UPDATE_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Upgrade selected packages
        uses: valicm/drupal-update@v5.0.0
        with:
          update_type: major
          update_scope: core
      - name: Validate Composer files and platform
        run: |
          composer validate --no-check-publish
          composer check-platform-reqs --lock
      # Run project-specific tests here and require site validation on update PRs.
      - name: Create or update the upgrade PR
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DRUPAL_UPDATE_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: updates/drupal-core-major
          title: Drupal core major upgrade
          commit-message: Drupal core major upgrade
          body: ${{ env.DRUPAL_UPDATES_TABLE }}
          # Keep scaffolded/config changes; exclude the updater's backup directories.
          # Normal repository ignore rules still apply to vendor and installed packages.
          add-paths: |
            .
            :(exclude).drupal-update-backup-*/**
          delete-branch: true
