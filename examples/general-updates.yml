# Copy into .github/workflows/ in your Drupal project.
# Set DRUPAL_UPDATE_TOKEN to a PAT with Contents and Pull requests write.
# For a GitHub App, generate a token in the job and use that step output instead.
# Match PHP/extensions below to the project and configure its PR validation checks.
name: Manual Drupal upgrades
on:
  workflow_dispatch:
    inputs:
      update_type:
        description: Upgrade mode (all retains legacy behavior)
        type: choice
        options: [minor, major, all, security]
        default: minor
      update_scope:
        description: Packages to target
        type: choice
        options: [all, core, contrib]
        default: all
      update_packages:
        description: Optional comma-separated module or package names
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: drupal-dependency-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Require the automation token
        env:
          UPDATE_TOKEN: ${{ secrets.DRUPAL_UPDATE_TOKEN }}
        run: |
          if [ -z "$UPDATE_TOKEN" ]; then
            echo "Set DRUPAL_UPDATE_TOKEN so update PRs can trigger required checks."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.DRUPAL_UPDATE_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Upgrade selected packages
        uses: valicm/drupal-update@v5.0.0
        with:
          update_type: ${{ inputs.update_type }}
          update_scope: ${{ inputs.update_scope }}
          update_packages: ${{ inputs.update_packages }}
      - name: Validate Composer files and platform
        run: |
          composer validate --no-check-publish
          composer check-platform-reqs --lock
      # Run project-specific tests here and require site validation on update PRs.
      - name: Create or update the upgrade PR
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DRUPAL_UPDATE_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: updates/drupal-manual-${{ inputs.update_type }}-${{ inputs.update_scope }}
          title: Drupal ${{ inputs.update_type }} updates (${{ inputs.update_scope }})
          commit-message: Drupal ${{ inputs.update_type }} updates (${{ inputs.update_scope }})
          body: ${{ env.DRUPAL_UPDATES_TABLE }}
          # Keep scaffolded/config changes; exclude the updater's backup directories.
          # Normal repository ignore rules still apply to vendor and installed packages.
          add-paths: |
            .
            :(exclude).drupal-update-backup-*/**
          delete-branch: true
