# Copy into .github/workflows/ in your Drupal project.
# Set DRUPAL_UPDATE_TOKEN to a PAT with Contents and Pull requests write.
# For a GitHub App, generate a token in the job and use that step output instead.
# Match PHP/extensions below to the project and configure its PR validation checks.
name: Daily Drupal security updates
on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *' # Every day at 20:00 UTC; daily checks also cover out-of-window releases.
permissions:
  contents: read
concurrency:
  group: drupal-dependency-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Require the automation token
        env:
          UPDATE_TOKEN: ${{ secrets.DRUPAL_UPDATE_TOKEN }}
        run: |
          if [ -z "$UPDATE_TOKEN" ]; then
            echo "Set DRUPAL_UPDATE_TOKEN so update PRs can trigger required checks."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.DRUPAL_UPDATE_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Upgrade selected packages
        uses: valicm/drupal-update@v5.0.3
        with:
          update_type: security
          update_scope: all
      - name: Validate Composer files and platform
        run: |
          composer validate --no-check-publish
          composer check-platform-reqs --lock
      # Run project-specific tests here and require site validation on update PRs.
      - name: Create or update the upgrade PR
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DRUPAL_UPDATE_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: updates/drupal-security
          title: Drupal security updates
          commit-message: Drupal security updates
          body: ${{ env.DRUPAL_UPDATES_TABLE }}
          # Keep scaffolded/config changes; exclude the updater's backup directories.
          # Normal repository ignore rules still apply to vendor and installed packages.
          add-paths: |
            .
            :(exclude).drupal-update-backup-*/**
          delete-branch: true
      # Enable repository automerge and required checks on the base branch first.
      # This does not approve reviews or bypass branch protection/merge queues.
      - name: Enable security PR automerge
        if: steps.pr.outputs.pull-request-number != '' && steps.pr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ secrets.DRUPAL_UPDATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$PR_HEAD_SHA"
